name: Sync UML to Wiki
on:
  push:
    branches: [ main ]
    paths:
      - 'uml/**'
      - 'tools/update_wiki.py'

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          path: main_repo

      - name: Checkout Wiki Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki_repo

      - name: Run Python Injector
        run: |
          python main_repo/tools/update_wiki.py wiki_repo main_repo/uml

      - name: Commit and Push to Wiki
        run: |
          cd wiki_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Auto-update Mermaid diagrams"
          git push
